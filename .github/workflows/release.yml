name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+\.[0-9]+\.[0-9]+'

permissions:
  contents: write

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Resolve version from tag
        run: echo "PLUGIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build plugin
        run: ./gradlew buildPlugin jar -PpluginVersion="$PLUGIN_VERSION"

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin -PpluginVersion="$PLUGIN_VERSION"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ env.PLUGIN_VERSION }}
          path: |
            build/distributions/*.zip
            build/libs/*.jar

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/distributions/*.zip
            build/libs/*.jar

      - name: Publish to Marketplace
        run: ./gradlew publishPlugin -PpluginVersion="$PLUGIN_VERSION"
        env:
          PUBLISH_TOKEN: ${{ secrets.PLUGIN_PUBLISH_TOKEN }}
